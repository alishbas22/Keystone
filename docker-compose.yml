# Local Keystone stack: Neo4j (graph database) + Keystone API (uses Graphiti as a library).
# Usage:  cp .env.example .env   (set NEO4J_PASSWORD)   then   docker compose up -d --build
services:
  neo4j:
    image: neo4j:5.26-community   # Graphiti requires Neo4j 5.26
    ports:
      - "7474:7474"   # Neo4j Browser (web UI)
      - "7687:7687"   # Bolt protocol (used by Graphiti)
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Inside Docker, Neo4j is reached by its service name, not localhost.
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy

  sales-db: # demo sales database (KAN-35): docker compose --profile demo up -d sales-db
    image: postgres:17
    profiles: [demo]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales-demo-password
      POSTGRES_DB: sales
    volumes:
      - ./demo/sales/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

volumes:
  neo4j_data:
