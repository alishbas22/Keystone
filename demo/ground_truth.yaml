contradictions:
  - id: harbor-account-manager
    rule: time
    relation: manages_account
    claims:
      - {subject: Sara Khan, object: Harbor Hotels Group, document: 2025-03-10_harbor_hotels_account_plan.docx}
      - {subject: Bilal Ahmed, object: Harbor Hotels Group, document: 2026-09-15_account_reassignment_memo.docx}
    expected_current: Bilal Ahmed
  - id: harbor-chair-sentiment
    rule: time
    claims:
      - {subject: Harbor Hotels Group, relation: likes, object: Ergo Desk Chair, document: 2025-04-02_harbor_feedback.eml}
      - {subject: Harbor Hotels Group, relation: dislikes, object: Ergo Desk Chair, document: 2026-05-20_harbor_complaint.eml}
    expected_current: dislikes
  - id: shipment-carrier
    rule: source authority
    relation: carried_by
    claims:
      - {subject: SHP-0077, object: DHL Freight, document: 2026-03-02_shipping_agreement_dhl.pdf}
      - {subject: SHP-0077, object: UPS, document: 2026-03-02_shipment_update.eml}
    expected_current: DHL Freight
  - id: greenleaf-account-manager
    rule: corroboration
    relation: manages_account
    claims:
      - {subject: Bilal Ahmed, object: Greenleaf Clinics, document: 2026-04-10_greenleaf_handover_a.eml}
      - {subject: Bilal Ahmed, object: Greenleaf Clinics, document: 2026-04-10_greenleaf_handover_b.eml}
      - {subject: Sara Khan, object: Greenleaf Clinics, document: 2026-04-10_greenleaf_note.eml}
    expected_current: Bilal Ahmed
  - id: crestview-parent
    rule: undecided
    relation: subsidiary_of
    claims:
      - {subject: Crestview Bank, object: Northstar Holdings, document: 2026-02-14_crestview_parent_a.eml}
      - {subject: Crestview Bank, object: Meridian Group, document: 2026-02-14_crestview_parent_b.eml}
    expected_current: null

