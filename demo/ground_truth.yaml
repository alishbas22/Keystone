# Ground truth for the sample company (KAN-35), used by the evaluation (KAN-37).
#
# facts:           key facts each document must produce, as [subject, relation, object] with
#                  ontology relations. Documents marked `complete: true` list ALL their facts, so
#                  extraction precision can be measured on them.
# contradictions:  the planted contradictions, the rule that must decide them and the expected
#                  current claim (null = must stay disputed).
# same_entity:     names that must resolve to one entity.
# different:       names that must NOT be merged.
# scope:           per business function, facts an agent with only that function must not see.
# questions:       questions for the answer-grounding check, with words the answer must contain.

