[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "Keystone connector: {{ cookiecutter.description }}"
authors = [{ name = "{{ cookiecutter.author }}" }]
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "keystone @ git+https://github.com/alishbas22/Keystone.git",
]

# This is how Keystone finds your connector after `pip install`.
# The name on the left must equal `manifest.name` in connector.py.
[project.entry-points."keystone.connectors"]
{{ cookiecutter.connector_name }} = "{{ cookiecutter.package_name }}:{{ cookiecutter.class_name }}"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.package_name }}"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
