[project]
name = "keystone"
version = "0.1.0"
description = "Open-source business ontology layer for AI agents. Every fact has a source. Every answer has proof."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.12 is the target (see .python-version). 3.13+ is not yet tested because
# Docling's ML dependencies lag behind new Python releases on Windows.
requires-python = ">=3.11,<3.13"
dependencies = [
    "graphiti-core>=0.32.1,<0.33",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "rdflib>=7.6,<8",
    "pyyaml>=6.0",
    "docling>=2.152,<3",
    "streamlit>=1.40",
    "truststore>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261122",
    "fpdf2>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs Docling's PDF models (downloaded on first use)"]
filterwarnings = ["ignore::pydantic.PydanticDeprecatedSince20:graphiti_core.*"]
