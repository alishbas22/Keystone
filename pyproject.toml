[project]
name = "keystone"
version = "0.1.0"
description = "Open-source business ontology layer for AI agents. Every fact has a source. Every answer has proof."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
# 3.12 is the target (see .python-version). 3.13+ is not yet tested because
# Docling's ML dependencies lag behind new Python releases on Windows.
requires-python = ">=3.11,<3.13"
dependencies = [
    "graphiti-core[google-genai]>=0.32.1,<0.33",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.6,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "rdflib>=7.6,<8",
    "pyyaml>=6.0",
    "docling>=2.152,<3",
    "streamlit>=1.40",
    "truststore>=0.10",
    # Used by Docling. Listed here only to pick the CPU-only build on Linux (see tool.uv).
    "torch>=2.15",
    "torchvision>=0.29",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "rapidfuzz>=3.10,<4",
    "mcp>=2.3,<3",
    "google-api-python-client>=2.150,<2.203",
    "google-auth>=2.40,<2.63",
    "google-auth-oauthlib>=1.2,<2",
    "google-auth-httplib2>=0.2,<0.5",
]

# Built-in connectors register the same way third-party connector packages do.
[project.entry-points."keystone.connectors"]
folder = "keystone.connectors.folder:FolderConnector"
sql = "keystone.connectors.sql:SqlConnector"
google-drive = "keystone.connectors.google.drive:DriveConnector"
gmail = "keystone.connectors.google.gmail:GmailConnector"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20261122",
    "fpdf2>=2.8",
    "cookiecutter>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keystone"]

# On Linux (CI, Docker) PyPI's torch bundles several GB of GPU (CUDA) libraries that Keystone
# does not need. Use the CPU-only builds there. Windows and macOS wheels on PyPI are CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md", "templates"]  # templates hold {{ cookiecutter }} placeholders

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # test data tables read better one row per line
"demo/make_sample_docs.py" = ["E501"]  # sample document text
"eval/*" = ["E501"]  # report table templates

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared helpers as `tests.<module>`
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: needs Docling's PDF models (downloaded on first use)"]
filterwarnings = ["ignore::pydantic.PydanticDeprecatedSince20:graphiti_core.*"]
