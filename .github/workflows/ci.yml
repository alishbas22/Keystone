# Continuous integration (KAN-13): lint, format, type check and tests on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRAPHITI_TELEMETRY_ENABLED: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv and Python (version from .python-version)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-python: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Cache Docling models
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ hashFiles('uv.lock') }}
          restore-keys: docling-models-

      - name: Tests (pytest)
        run: uv run pytest -q
