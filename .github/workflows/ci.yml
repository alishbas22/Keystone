# Continuous integration (KAN-13): lint, format, type check and tests on every push and PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, type check, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres: # for the SQL connector tests
        image: postgres:17
        env:
          POSTGRES_USER: keystone
          POSTGRES_PASSWORD: keystone
          POSTGRES_DB: keystone_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U keystone" --health-interval 5s
          --health-timeout 5s --health-retries 10
      neo4j: # for the graph store and scope filtering tests
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/keystone-ci-password
        ports: ["7687:7687", "7474:7474"]
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1" --health-interval 5s
          --health-timeout 5s --health-retries 30 --health-start-period 20s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: keystone-ci-password
      GRAPHITI_TELEMETRY_ENABLED: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      KEYSTONE_TEST_POSTGRES_URL: postgresql+psycopg://keystone:keystone@localhost:5432/keystone_test
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv and Python (version from .python-version)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-python: true

      - name: Install dependencies (exact versions from uv.lock)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Cache Docling models
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/huggingface
          key: docling-models-${{ hashFiles('uv.lock') }}
          restore-keys: docling-models-

      - name: Tests (pytest)
        run: uv run pytest -q
